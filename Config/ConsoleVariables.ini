[Startup]
; Light Function Atlas null resource crash 방지 (UE5.5 bug)
r.LightFunction.Atlas=0
r.LightFunction.Atlas.Format=0

; ── Virtual Shadow Map 페이지 풀 오버플로우 완화 ──
; 다중 포탈 뷰 + 가로등 등 로컬 라이트가 많아 VSM 페이지 풀(512)이 넘침.
; 로컬 라이트 그림자 해상도를 낮춰(=Bias 상향) 페이지 수요를 줄임.
; 추가 VRAM 없이 경고/그림자 누락 완화, 그림자만 약간 부드러워짐.
r.Shadow.Virtual.ResolutionLodBiasLocal=2.0
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=2.0

; ── Engine Scalability = Medium 고정 ──
; 실행할 때마다 그래픽 품질을 Medium(레벨 1)으로 맞춰 벤치마크 조건 일관성 유지.
; (0=Low, 1=Medium, 2=High, 3=Epic). 해상도는 네이티브 유지(ResolutionQuality 미설정).
sg.ViewDistanceQuality=1
sg.ShadowQuality=1
sg.GlobalIlluminationQuality=1
sg.ReflectionQuality=1
sg.PostProcessQuality=1
sg.TextureQuality=1
sg.EffectsQuality=1
sg.FoliageQuality=1
sg.ShadingQuality=1
sg.AntiAliasingQuality=1

; ── VR 렌더 해상도(픽셀 밀도) 낮춰 비용 절감 ──
; 1.0=100%. 0.85면 픽셀 ~72%로 줄어 VR 프레임 확보. 화질/프레임 균형 보고 0.7~1.0 조절.
vr.PixelDensity=0.85
